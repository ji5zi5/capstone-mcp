[project]
name = "capstone-mcp"
version = "0.1.1"
description = "Local Windows UI automation MCP for PASCO Capstone"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4,<5",
    "defusedxml>=0.7.1,<0.8",
    "httpx2[http2,brotli,zstd]",
    "mcp>=1.20,<2",
    "pydantic>=2,<3",
    "pywin32>=305; sys_platform == 'win32'",
    "pywinauto>=0.6.9,<0.7",
    "pillow>=11",
    "psutil>=7,<9",
    "websockets>=15,<18",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "ruff", "basedpyright", "types-psutil"]

[project.scripts]
capstone-mcp = "capstone_mcp.server:main"
capstone-mcp-http = "capstone_mcp.server:http_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/scratch",
    "/docs/audits",
    "/docs/reverse_engineering_dump.json",
    "/docs/reverse_engineering_findings.md",
    "/EXHAUSTIVE_*.md",
    "/PHASE4_EXHAUSTIVE_EDGE_AUDIT_REPORT.md",
]

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D", "SLF001", "E501"]
"src/capstone_mcp/tools/**" = ["C901", "E501"]
"src/capstone_mcp/tutor/curriculum.py" = ["E501"]
"src/capstone_mcp/tutor/lesson_generator.py" = ["E501"]
"src/capstone_mcp/tutor/workspace_sync.py" = ["E501"]
"src/capstone_mcp/numerics/sparklines.py" = ["E501", "PLR0913", "PLR0917"]



[tool.basedpyright]
typeCheckingMode = "standard"
stubPath = "typings"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
