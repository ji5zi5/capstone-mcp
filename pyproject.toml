[project]
name = "capstone-mcp"
version = "0.1.0"
description = "Local Windows UI automation MCP for PASCO Capstone"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1,<0.8",
    "httpx2[http2,brotli,zstd]",
    "mcp>=1.20,<2",
    "pywinauto>=0.6.9,<0.7",
    "pillow>=11",
    "psutil>=7,<9",
    "websockets>=15,<18",
]

[dependency-groups]
dev = ["pytest>=8", "ruff", "basedpyright", "types-psutil"]

[project.scripts]
capstone-mcp = "capstone_mcp.server:main"
capstone-mcp-http = "capstone_mcp.server:http_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff.lint]
select = ["ALL"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D"]
"src/capstone_mcp/tutor/curriculum.py" = ["E501"]
"src/capstone_mcp/tutor/lesson_generator.py" = ["E501"]
"src/capstone_mcp/tutor/workspace_sync.py" = ["E501"]
"src/capstone_mcp/numerics/sparklines.py" = ["E501", "PLR0913", "PLR0917"]



[tool.basedpyright]
typeCheckingMode = "all"
stubPath = "typings"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
